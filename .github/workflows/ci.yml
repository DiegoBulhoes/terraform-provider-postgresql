name: CI

# Shared by test.yml and release.yml, so both run the same checks.
on:
  workflow_call:
    inputs:
      pg_versions:
        description: "JSON list of PostgreSQL major versions"
        type: string
        default: '["14", "15", "16", "17", "18"]'

permissions:
  contents: read

env:
  # Newest Terraform 1.x release; MIN_TERRAFORM is the oldest the README promises.
  TERRAFORM_VERSION: "1.16.6"
  MIN_TERRAFORM: "1.5.7"
  COVERAGE_FLOOR: "90"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Run go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "Run 'make fmt'" && exit 1)

      - name: Run golangci-lint
        run: go tool golangci-lint run ./...

      - name: Lint workflows
        run: go tool actionlint

      # tfplugindocs exports the provider schema through Terraform. Without a
      # binary on PATH it downloads one via hc-install, which currently fails
      # PGP verification ("openpgp: key expired").
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate documentation
        run: go tool tfplugindocs validate --provider-name postgresql

      - name: Run govulncheck
        run: go tool govulncheck ./...

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage-unit.out ./test/unit/...

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage-unit.out

  acceptance:
    name: Acceptance (PostgreSQL ${{ matrix.postgres_version }}, Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ${{ fromJSON(inputs.pg_versions) }}
        terraform: [latest]
        include:
          - postgres_version: "17"
            terraform: minimum
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform == 'minimum' && env.MIN_TERRAFORM || env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          POSTGRES_IMAGE: "postgres:${{ matrix.postgres_version }}-alpine"
        run: go test -tags integration -timeout 900s -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage-acceptance.out ./test/integration/...

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.postgres_version == '17' && matrix.terraform == 'latest'
        with:
          name: coverage-acceptance
          path: coverage-acceptance.out

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [acceptance]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Check the coverage floor
        run: ./scripts/coverage.sh "$COVERAGE_FLOOR" coverage-unit.out coverage-acceptance.out

      # act sets ACT; a local run must not upload coverage.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !env.ACT }}
        with:
          files: coverage-unit.out,coverage-acceptance.out
          fail_ci_if_error: false
