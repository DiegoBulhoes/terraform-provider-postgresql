name: Release
run-name: "Release - terraform-provider-postgresql ${{ github.event_name == 'push' && github.ref_name || format('({0} bump)', startsWith(github.event.inputs.bump, 'major') && 'major' || startsWith(github.event.inputs.bump, 'minor') && 'minor' || 'patch') }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (next tag is computed from the latest v* tag)"
        type: choice
        required: true
        default: "patch (x.y.Z - bug fixes)"
        options:
          - "patch (x.y.Z - bug fixes)"
          - "minor (x.Y.0 - feature)"
          - "major (X.0.0 - breaking changes)"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        env:
          BUMP: ${{ github.event.inputs.bump }}
          PUSHED_TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            tag="$PUSHED_TAG"
            echo "Tag comes from the pushed ref: $tag"
          else
            last=$(git tag -l 'v*' --sort=-v:refname | head -1)
            last="${last:-v0.0.0}"
            base="${last#v}"
            base="${base%%-*}"
            IFS='.' read -r major minor patch <<< "$base"
            # The choice values carry a human-readable suffix ("patch (x.y.Z - ...)")
            # because GitHub Actions has no per-option description; keep the keyword only.
            BUMP="${BUMP%% *}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
            esac
            tag="v${major}.${minor}.${patch}"
            echo "Latest tag: $last -> $BUMP bump -> $tag"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag already exists"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Release tag: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: [version]
    # A release always runs the full matrix.
    uses: ./.github/workflows/ci.yml

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [version, ci]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: git tag "$TAG"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Import GPG key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$fingerprint" ]; then
            echo "::error::no secret key was imported"
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
