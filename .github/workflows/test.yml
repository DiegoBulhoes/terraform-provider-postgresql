name: Tests
run-name: "Tests - ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly, to catch new PostgreSQL images and new advisories without a change.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      pg14:
        description: "PostgreSQL 14"
        type: boolean
        default: true
      pg15:
        description: "PostgreSQL 15"
        type: boolean
        default: true
      pg16:
        description: "PostgreSQL 16"
        type: boolean
        default: true
      pg17:
        description: "PostgreSQL 17"
        type: boolean
        default: true
      pg18:
        description: "PostgreSQL 18"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-matrix:
    name: Resolve Matrix
    runs-on: ubuntu-latest
    outputs:
      pg_versions: ${{ steps.build.outputs.versions }}
    steps:
      - name: Build acceptance matrix
        id: build
        env:
          PG14: ${{ github.event.inputs.pg14 }}
          PG15: ${{ github.event.inputs.pg15 }}
          PG16: ${{ github.event.inputs.pg16 }}
          PG17: ${{ github.event.inputs.pg17 }}
          PG18: ${{ github.event.inputs.pg18 }}
        run: |
          set -euo pipefail
          # Without workflow_dispatch these inputs are empty, so the "!= false"
          # test keeps every version in the matrix without branching on the event.
          selected=()
          [ "$PG14" = "false" ] || selected+=(14)
          [ "$PG15" = "false" ] || selected+=(15)
          [ "$PG16" = "false" ] || selected+=(16)
          [ "$PG17" = "false" ] || selected+=(17)
          [ "$PG18" = "false" ] || selected+=(18)
          if [ ${#selected[@]} -eq 0 ]; then
            echo "::error::select at least one PostgreSQL version"
            exit 1
          fi
          versions=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "### Acceptance matrix: PostgreSQL ${selected[*]}" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: [resolve-matrix]
    uses: ./.github/workflows/ci.yml
    with:
      pg_versions: ${{ needs.resolve-matrix.outputs.pg_versions }}
