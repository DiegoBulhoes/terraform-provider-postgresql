name: Tests
run-name: "Tests - ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pg14:
        description: "PostgreSQL 14"
        type: boolean
        default: true
      pg15:
        description: "PostgreSQL 15"
        type: boolean
        default: true
      pg16:
        description: "PostgreSQL 16"
        type: boolean
        default: true
      pg17:
        description: "PostgreSQL 17"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve Matrix
    runs-on: ubuntu-latest
    outputs:
      pg_versions: ${{ steps.build.outputs.versions }}
    steps:
      - name: Build acceptance matrix
        id: build
        env:
          PG14: ${{ github.event.inputs.pg14 }}
          PG15: ${{ github.event.inputs.pg15 }}
          PG16: ${{ github.event.inputs.pg16 }}
          PG17: ${{ github.event.inputs.pg17 }}
        run: |
          set -euo pipefail
          # On pull_request these inputs are absent (empty), so the "!= false"
          # test keeps every version in the matrix without branching on the event.
          selected=()
          [ "$PG14" = "false" ] || selected+=(14)
          [ "$PG15" = "false" ] || selected+=(15)
          [ "$PG16" = "false" ] || selected+=(16)
          [ "$PG17" = "false" ] || selected+=(17)
          if [ ${#selected[@]} -eq 0 ]; then
            echo "::error::select at least one PostgreSQL version"
            exit 1
          fi
          versions=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "### Acceptance matrix: PostgreSQL ${selected[*]}" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)" || (echo "Run 'make fmt'" && exit 1)

      - name: Run golangci-lint
        run: go tool golangci-lint run ./...

      - name: Validate documentation
        run: go tool tfplugindocs validate

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage-unit.out ./test/unit/...

  acceptance:
    name: Acceptance Tests (PostgreSQL ${{ matrix.postgres_version }})
    runs-on: ubuntu-latest
    needs: [resolve-matrix, unit]
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ${{ fromJSON(needs.resolve-matrix.outputs.pg_versions) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          POSTGRES_IMAGE: "postgres:${{ matrix.postgres_version }}-alpine"
        run: go test -tags integration -timeout 600s -coverprofile=coverage.out -coverpkg=./internal/... ./...

      - name: Print coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        if: matrix.postgres_version == '17'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: acceptance
          fail_ci_if_error: false
